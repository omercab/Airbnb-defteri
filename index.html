<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ev Defteri — Airbnb Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141922;
    --bg-soft:#1b222c;
    --card:#212a35;
    --paper:#f4efe3;
    --ink:#f4efe3;
    --ink-dim:#a9b2bf;
    --line:#333f4d;
    --gold:#c9a227;
    --gold-soft:#e0c05f;
    --income:#7fa88f;
    --expense:#b5563c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(201,162,39,0.08), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    -webkit-tap-highlight-color: transparent;
  }
  header{
    padding:24px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(20,25,34,0.94);
    backdrop-filter: blur(6px);
    z-index:10;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 16px;}

  /* Period filter */
  .period-bar{
    display:flex;
    gap:8px;
    margin:16px auto 10px;
    align-items:center;
  }
  .mode-toggle{
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .mode-toggle button{
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:8px 12px;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--gold);
    color:#1b1607;
    font-weight:600;
  }
  .period-bar select{
    flex:1;
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
  }

  /* Summary grid */
  .summary{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin:14px auto 18px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 8px;
    text-align:center;
  }
  .stat .label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    margin-bottom:5px;
    line-height:1.3;
  }
  .stat .value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
  }
  .stat.net .value{color:var(--gold-soft);}
  .stat.income .value{color:var(--income);}
  .stat.expense .value{color:var(--expense);}

  /* Tabs */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:12px 6px;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{
    color:var(--gold-soft);
    border-bottom-color:var(--gold);
  }

  .add-btn{
    display:block;
    width:100%;
    padding:14px;
    background:var(--gold);
    color:#1b1607;
    border:none;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-bottom:20px;
  }
  .add-btn:active{background:var(--gold-soft);}

  /* Booking ticket card */
  .ticket{
    background:var(--paper);
    color:#241f14;
    border-radius:12px;
    margin-bottom:16px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    position:relative;
    cursor:pointer;
  }
  .ticket-top{
    padding:16px 16px 14px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .guest-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 4px;
  }
  .dates{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:#5c5340;
  }
  .nights-badge{
    background:#241f14;
    color:var(--gold-soft);
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12px;
    padding:6px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .perforation{
    border-top:2px dashed #cfc6ac;
    position:relative;
    margin:0 16px;
  }
  .perforation::before,.perforation::after{
    content:'';
    position:absolute;
    top:-9px;
    width:18px;height:18px;
    background:var(--bg);
    border-radius:50%;
  }
  .perforation::before{left:-25px;}
  .perforation::after{right:-25px;}
  .ticket-bottom{
    padding:14px 16px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .money-row{display:flex;gap:16px;}
  .money{font-family:'IBM Plex Mono', monospace;font-size:13px;}
  .money .amt{font-weight:600;font-size:14.5px;display:block;}
  .money.income .amt{color:#3f6b52;}
  .guest-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:#5c5340;
  }
  .note{
    font-size:12px;
    color:#5c5340;
    padding:0 16px 14px;
    font-style:italic;
  }
  .del-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:none;
    border:none;
    color:#8c3f2b;
    font-size:16px;
    cursor:pointer;
    opacity:0.55;
    padding:4px 8px;
    z-index:2;
  }

  /* Expense row */
  .expense-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
    position:relative;
  }
  .expense-left{display:flex;flex-direction:column;gap:4px;}
  .expense-cat{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
  }
  .expense-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-dim);
  }
  .expense-note{
    font-size:12px;
    color:var(--ink-dim);
    font-style:italic;
  }
  .expense-amt{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:15px;
    color:var(--expense);
    white-space:nowrap;
  }
  .expense-del{
    background:none;
    border:none;
    color:var(--expense);
    font-size:15px;
    cursor:pointer;
    opacity:0.6;
    padding:4px 6px;
  }

  .empty{
    text-align:center;
    color:var(--ink-dim);
    padding:40px 20px;
    font-size:14px;
  }

  /* Modal form */
  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,13,18,0.72);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg-soft);
    width:100%;
    max-width:600px;
    border-radius:20px 20px 0 0;
    padding:22px 20px 30px;
    max-height:88vh;
    overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .sheet h2{
    font-family:'Fraunces', serif;
    font-size:20px;
    margin:0 0 18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 12px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:15px;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .save-btn{background:var(--gold);color:#1b1607;}
  .cancel-btn{background:transparent;border:1px solid var(--line) !important;color:var(--ink-dim);}
  .delete-btn-form{background:transparent;border:1px solid var(--expense) !important;color:var(--expense);flex:0 0 auto;padding:13px 16px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="eyebrow">Ev Defteri</p>
    <h1>Airbnb Gelir · Gider</h1>
  </div>
</header>

<div class="wrap">

  <div class="period-bar">
    <div class="mode-toggle">
      <button id="modeMonth" class="active" onclick="setMode('month')">Aylık</button>
      <button id="modeYear" onclick="setMode('year')">Yıllık</button>
    </div>
    <select id="periodSelect"></select>
  </div>

  <div class="summary">
    <div class="stat income">
      <div class="label">Gelir</div>
      <div class="value" id="statIncome">₺0</div>
    </div>
    <div class="stat expense">
      <div class="label">Gider</div>
      <div class="value" id="statExpense">₺0</div>
    </div>
    <div class="stat net">
      <div class="label">Net</div>
      <div class="value" id="statNet">₺0</div>
    </div>
    <div class="stat">
      <div class="label">Toplam Gece</div>
      <div class="value" id="statNights">0</div>
    </div>
    <div class="stat">
      <div class="label">Ort. Gece Fiyatı</div>
      <div class="value" id="statAvgNight">₺0</div>
    </div>
    <div class="stat">
      <div class="label">Rezervasyon</div>
      <div class="value" id="statCount">0</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabBookings" onclick="switchTab('bookings')">Rezervasyonlar</button>
    <button class="tab" id="tabExpenses" onclick="switchTab('expenses')">Giderler</button>
  </div>

  <button class="add-btn" id="addBookingBtn" onclick="openBookingSheet()">+ Yeni Rezervasyon Ekle</button>
  <button class="add-btn" id="addExpenseBtn" style="display:none;" onclick="openExpenseSheet()">+ Yeni Gider Ekle</button>

  <div id="bookingList"></div>
  <div id="expenseList" style="display:none;"></div>

</div>

<!-- Booking sheet -->
<div class="overlay" id="bookingOverlay">
  <div class="sheet">
    <h2 id="bookingSheetTitle">Yeni Rezervasyon</h2>
    <div class="field">
      <label>Müşteri Adı</label>
      <input type="text" id="fGuest" placeholder="Örn. Ahmet Y.">
    </div>
    <div class="row2">
      <div class="field">
        <label>Giriş Tarihi</label>
        <input type="date" id="fCheckin">
      </div>
      <div class="field">
        <label>Çıkış Tarihi</label>
        <input type="date" id="fCheckout">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Kişi Sayısı</label>
        <input type="number" id="fGuests" min="1" placeholder="2">
      </div>
      <div class="field">
        <label>Gece Sayısı</label>
        <input type="number" id="fNights" placeholder="otomatik" readonly>
      </div>
    </div>
    <div class="field">
      <label>Gelir (₺)</label>
      <input type="number" id="fIncome" placeholder="0">
    </div>
    <div class="field">
      <label>Not</label>
      <textarea id="fNote" placeholder="İsteğe bağlı"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="delete-btn-form" id="bookingDeleteBtn" style="display:none;" onclick="deleteCurrentBooking()">Sil</button>
      <button class="cancel-btn" onclick="closeBookingSheet()">Vazgeç</button>
      <button class="save-btn" onclick="saveBooking()">Kaydet</button>
    </div>
  </div>
</div>

<!-- Expense sheet -->
<div class="overlay" id="expenseOverlay">
  <div class="sheet">
    <h2 id="expenseSheetTitle">Yeni Gider</h2>
    <div class="field">
      <label>Kategori</label>
      <select id="fCategory">
        <option>Havuz Masrafı</option>
        <option>Elektrik</option>
        <option>Su</option>
        <option>Doğalgaz</option>
        <option>İnternet</option>
        <option>Temizlik Malzemesi</option>
        <option>Tuvalet Kağıdı / Sarf Malzeme</option>
        <option>Bakım / Onarım</option>
        <option>Aidat</option>
        <option>Komisyon</option>
        <option>Vergi</option>
        <option>Diğer</option>
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Tarih</label>
        <input type="date" id="fExpDate">
      </div>
      <div class="field">
        <label>Tutar (₺)</label>
        <input type="number" id="fExpAmount" placeholder="0">
      </div>
    </div>
    <div class="field">
      <label>Not</label>
      <textarea id="fExpNote" placeholder="İsteğe bağlı"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="delete-btn-form" id="expenseDeleteBtn" style="display:none;" onclick="deleteCurrentExpense()">Sil</button>
      <button class="cancel-btn" onclick="closeExpenseSheet()">Vazgeç</button>
      <button class="save-btn" onclick="saveExpense()">Kaydet</button>
    </div>
  </div>
</div>

<script>
  const BOOKINGS_KEY = 'ev_defteri_kayitlar_v1';
  const EXPENSES_KEY = 'ev_defteri_giderler_v1';

  function loadData(key){
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveData(key, list){ localStorage.setItem(key, JSON.stringify(list)); }

  let bookings = loadData(BOOKINGS_KEY);
  let expenses = loadData(EXPENSES_KEY);

  let currentTab = 'bookings';
  let periodMode = 'month'; // 'month' | 'year'
  let editingBookingId = null;
  let editingExpenseId = null;

  /* ---------- Period filter ---------- */
  function monthKey(d){ return d.slice(0,7); }
  function yearKey(d){ return d.slice(0,4); }

  function setMode(mode){
    periodMode = mode;
    document.getElementById('modeMonth').classList.toggle('active', mode==='month');
    document.getElementById('modeYear').classList.toggle('active', mode==='year');
    populatePeriodSelect();
    render();
  }

  function monthLabel(key){
    const [y,m] = key.split('-');
    return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('tr-TR', {month:'long', year:'numeric'});
  }

  function populatePeriodSelect(){
    const select = document.getElementById('periodSelect');
    const allDates = [
      ...bookings.map(b => b.checkin),
      ...expenses.map(e => e.date)
    ];
    let keys;
    if(periodMode === 'month'){
      keys = Array.from(new Set(allDates.map(monthKey))).sort().reverse();
    } else {
      keys = Array.from(new Set(allDates.map(yearKey))).sort().reverse();
    }
    const current = select.value;
    select.innerHTML = '<option value="all">Tümü</option>' +
      keys.map(k => `<option value="${k}">${periodMode==='month' ? monthLabel(k) : k}</option>`).join('');
    if(keys.includes(current)) select.value = current;
  }

  function inPeriod(dateStr, periodValue){
    if(periodValue === 'all') return true;
    return periodMode === 'month' ? monthKey(dateStr) === periodValue : yearKey(dateStr) === periodValue;
  }

  /* ---------- Tabs ---------- */
  function switchTab(tab){
    currentTab = tab;
    document.getElementById('tabBookings').classList.toggle('active', tab==='bookings');
    document.getElementById('tabExpenses').classList.toggle('active', tab==='expenses');
    document.getElementById('bookingList').style.display = tab==='bookings' ? '' : 'none';
    document.getElementById('expenseList').style.display = tab==='expenses' ? '' : 'none';
    document.getElementById('addBookingBtn').style.display = tab==='bookings' ? '' : 'none';
    document.getElementById('addExpenseBtn').style.display = tab==='expenses' ? '' : 'none';
  }

  /* ---------- Booking form ---------- */
  const fCheckin = document.getElementById('fCheckin');
  const fCheckout = document.getElementById('fCheckout');
  const fNights = document.getElementById('fNights');

  function computeNights(){
    if(fCheckin.value && fCheckout.value){
      const diff = Math.round((new Date(fCheckout.value) - new Date(fCheckin.value)) / (1000*60*60*24));
      fNights.value = diff > 0 ? diff : 0;
    } else { fNights.value = ''; }
  }
  fCheckin.addEventListener('change', computeNights);
  fCheckout.addEventListener('change', computeNights);

  function openBookingSheet(booking){
    editingBookingId = booking ? booking.id : null;
    document.getElementById('bookingSheetTitle').textContent = booking ? 'Rezervasyonu Düzenle' : 'Yeni Rezervasyon';
    document.getElementById('bookingDeleteBtn').style.display = booking ? '' : 'none';
    document.getElementById('fGuest').value = booking ? booking.guest : '';
    fCheckin.value = booking ? booking.checkin : '';
    fCheckout.value = booking ? booking.checkout : '';
    computeNights();
    document.getElementById('fGuests').value = booking ? booking.guestCount : '';
    document.getElementById('fIncome').value = booking ? booking.income : '';
    document.getElementById('fNote').value = booking ? booking.note : '';
    document.getElementById('bookingOverlay').classList.add('open');
  }
  function closeBookingSheet(){
    document.getElementById('bookingOverlay').classList.remove('open');
    editingBookingId = null;
  }

  function saveBooking(){
    const guest = document.getElementById('fGuest').value.trim();
    const checkin = fCheckin.value;
    const checkout = fCheckout.value;
    if(!guest || !checkin || !checkout){
      alert('Müşteri adı, giriş ve çıkış tarihi zorunlu.');
      return;
    }
    const data = {
      guest,
      checkin,
      checkout,
      nights: Number(fNights.value) || 0,
      guestCount: Number(document.getElementById('fGuests').value) || 1,
      income: Number(document.getElementById('fIncome').value) || 0,
      note: document.getElementById('fNote').value.trim()
    };
    if(editingBookingId){
      bookings = bookings.map(b => b.id === editingBookingId ? {...b, ...data} : b);
    } else {
      bookings.push({ id: Date.now(), ...data });
    }
    saveData(BOOKINGS_KEY, bookings);
    closeBookingSheet();
    populatePeriodSelect();
    render();
  }

  function deleteCurrentBooking(){
    if(!editingBookingId) return;
    if(!confirm('Bu kaydı silmek istediğine emin misin?')) return;
    bookings = bookings.filter(b => b.id !== editingBookingId);
    saveData(BOOKINGS_KEY, bookings);
    closeBookingSheet();
    populatePeriodSelect();
    render();
  }

  function deleteBookingDirect(id, evt){
    evt.stopPropagation();
    if(!confirm('Bu kaydı silmek istediğine emin misin?')) return;
    bookings = bookings.filter(b => b.id !== id);
    saveData(BOOKINGS_KEY, bookings);
    populatePeriodSelect();
    render();
  }

  /* ---------- Expense form ---------- */
  function openExpenseSheet(expense){
    editingExpenseId = expense ? expense.id : null;
    document.getElementById('expenseSheetTitle').textContent = expense ? 'Gideri Düzenle' : 'Yeni Gider';
    document.getElementById('expenseDeleteBtn').style.display = expense ? '' : 'none';
    document.getElementById('fCategory').value = expense ? expense.category : 'Havuz Masrafı';
    document.getElementById('fExpDate').value = expense ? expense.date : new Date().toISOString().slice(0,10);
    document.getElementById('fExpAmount').value = expense ? expense.amount : '';
    document.getElementById('fExpNote').value = expense ? expense.note : '';
    document.getElementById('expenseOverlay').classList.add('open');
  }
  function closeExpenseSheet(){
    document.getElementById('expenseOverlay').classList.remove('open');
    editingExpenseId = null;
  }

  function saveExpense(){
    const date = document.getElementById('fExpDate').value;
    const amount = Number(document.getElementById('fExpAmount').value) || 0;
    if(!date || amount <= 0){
      alert('Tarih ve tutar zorunlu.');
      return;
    }
    const data = {
      category: document.getElementById('fCategory').value,
      date,
      amount,
      note: document.getElementById('fExpNote').value.trim()
    };
    if(editingExpenseId){
      expenses = expenses.map(e => e.id === editingExpenseId ? {...e, ...data} : e);
    } else {
      expenses.push({ id: Date.now(), ...data });
    }
    saveData(EXPENSES_KEY, expenses);
    closeExpenseSheet();
    populatePeriodSelect();
    render();
  }

  function deleteCurrentExpense(){
    if(!editingExpenseId) return;
    if(!confirm('Bu gideri silmek istediğine emin misin?')) return;
    expenses = expenses.filter(e => e.id !== editingExpenseId);
    saveData(EXPENSES_KEY, expenses);
    closeExpenseSheet();
    populatePeriodSelect();
    render();
  }

  function deleteExpenseDirect(id, evt){
    evt.stopPropagation();
    if(!confirm('Bu gideri silmek istediğine emin misin?')) return;
    expenses = expenses.filter(e => e.id !== id);
    saveData(EXPENSES_KEY, expenses);
    populatePeriodSelect();
    render();
  }

  /* ---------- Helpers ---------- */
  function fmtMoney(n){ return '₺' + Math.round(n).toLocaleString('tr-TR'); }
  function fmtDate(d){ return new Date(d).toLocaleDateString('tr-TR', {day:'2-digit', month:'short'}); }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  /* ---------- Render ---------- */
  function render(){
    const periodValue = document.getElementById('periodSelect').value || 'all';

    const filteredBookings = bookings
      .filter(b => inPeriod(b.checkin, periodValue))
      .sort((a,b) => new Date(b.checkin) - new Date(a.checkin));
    const filteredExpenses = expenses
      .filter(e => inPeriod(e.date, periodValue))
      .sort((a,b) => new Date(b.date) - new Date(a.date));

    const totalIncome = filteredBookings.reduce((s,b) => s + b.income, 0);
    const totalExpense = filteredExpenses.reduce((s,e) => s + e.amount, 0);
    const totalNights = filteredBookings.reduce((s,b) => s + b.nights, 0);
    const avgNight = totalNights > 0 ? totalIncome / totalNights : 0;

    document.getElementById('statIncome').textContent = fmtMoney(totalIncome);
    document.getElementById('statExpense').textContent = fmtMoney(totalExpense);
    document.getElementById('statNet').textContent = fmtMoney(totalIncome - totalExpense);
    document.getElementById('statNights').textContent = totalNights;
    document.getElementById('statAvgNight').textContent = fmtMoney(avgNight);
    document.getElementById('statCount').textContent = filteredBookings.length;

    // Bookings list
    const bookingList = document.getElementById('bookingList');
    if(filteredBookings.length === 0){
      bookingList.innerHTML = '<div class="empty">Bu dönemde kayıt yok.</div>';
    } else {
      bookingList.innerHTML = filteredBookings.map(b => `
        <div class="ticket" onclick='openBookingSheet(${JSON.stringify(b)})'>
          <button class="del-btn" onclick="deleteBookingDirect(${b.id}, event)">✕</button>
          <div class="ticket-top">
            <div>
              <p class="guest-name">${escapeHtml(b.guest)}</p>
              <p class="dates">${fmtDate(b.checkin)} → ${fmtDate(b.checkout)}</p>
            </div>
            <div class="nights-badge">${b.nights} gece</div>
          </div>
          <div class="perforation"></div>
          <div class="ticket-bottom">
            <div class="money-row">
              <div class="money income"><span class="amt">${fmtMoney(b.income)}</span>gelir</div>
            </div>
            <div class="guest-count">${b.guestCount} kişi</div>
          </div>
          ${b.note ? `<div class="note">${escapeHtml(b.note)}</div>` : ''}
        </div>
      `).join('');
    }

    // Expenses list
    const expenseList = document.getElementById('expenseList');
    if(filteredExpenses.length === 0){
      expenseList.innerHTML = '<div class="empty">Bu dönemde gider kaydı yok.</div>';
    } else {
      expenseList.innerHTML = filteredExpenses.map(e => `
        <div class="expense-row" onclick='openExpenseSheet(${JSON.stringify(e)})'>
          <div class="expense-left">
            <span class="expense-cat">${escapeHtml(e.category)}</span>
            <span class="expense-date">${fmtDate(e.date)}</span>
            ${e.note ? `<span class="expense-note">${escapeHtml(e.note)}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="expense-amt">${fmtMoney(e.amount)}</span>
            <button class="expense-del" onclick="deleteExpenseDirect(${e.id}, event)">✕</button>
          </div>
        </div>
      `).join('');
    }
  }

  document.getElementById('periodSelect').addEventListener('change', render);

  populatePeriodSelect();
  render();
</script>

</body>
</html>
